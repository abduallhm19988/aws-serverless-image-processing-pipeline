<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760"><rect width="1400" height="760" fill="#fff"/><text x="700" y="38" text-anchor="middle" font-family="Arial" font-size="25" font-weight="bold" fill="#232f3e">Serverless Image Processing Pipeline on AWS</text><rect x="35" y="65" width="1330" height="650" rx="18" fill="#f8fbff" stroke="#8797a8" stroke-width="2"/><text x="60" y="95" font-family="Arial" font-size="17" font-weight="bold" fill="#232f3e">AWS Cloud · Single Region (proposed design)</text><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#566573"/></marker></defs><g font-family="Arial" text-anchor="middle"><g fill="#fff" stroke="#d79b00" stroke-width="2"><rect x="65" y="130" width="145" height="75" rx="8" stroke="#545b64"/><rect x="255" y="130" width="160" height="75" rx="8"/><rect x="460" y="130" width="145" height="75" rx="8"/><rect x="665" y="130" width="165" height="75" rx="8" stroke="#3f8f55"/><rect x="890" y="130" width="155" height="75" rx="8"/><rect x="1100" y="130" width="205" height="75" rx="8"/></g><g fill="#232f3e" font-size="16" font-weight="bold"><text x="137" y="160">Client</text><text x="335" y="159">API Gateway</text><text x="532" y="160">Lambda</text><text x="747" y="159">Amazon S3</text><text x="967" y="159">Amazon SQS</text><text x="1202" y="159">Lambda Dispatcher</text></g><g fill="#545b64" font-size="12"><text x="137" y="183">Browser / App</text><text x="335" y="182">POST /uploads/presign</text><text x="532" y="182">CreateUploadUrl</text><text x="747" y="182">Private source bucket</text><text x="967" y="182">Work queue</text><text x="1202" y="182">Starts workflow</text></g><g stroke="#566573" stroke-width="2.2" fill="none" marker-end="url(#a)"><path d="M210 168 H255"/><path d="M415 168 H460"/><path d="M605 168 H665"/><path d="M830 168 H890"/><path d="M1045 168 H1100"/></g><rect x="245" y="265" width="900" height="235" rx="14" fill="#f0f7ff" stroke="#527da8" stroke-width="2"/><text x="695" y="294" font-size="18" font-weight="bold" fill="#232f3e">AWS Step Functions Standard Workflow</text><g fill="#fff4e5" stroke="#d79b00" stroke-width="2"><rect x="275" y="325" width="150" height="72" rx="8"/><rect x="460" y="325" width="150" height="72" rx="8"/><rect x="645" y="325" width="150" height="72" rx="8"/><rect x="830" y="325" width="135" height="72" rx="8"/><rect x="1000" y="325" width="120" height="72" rx="8"/></g><g fill="#232f3e" font-size="14" font-weight="bold"><text x="350" y="354">ValidateImage</text><text x="535" y="354">ResizeImage</text><text x="720" y="354">ApplyWatermark</text><text x="897" y="354">ExtractMetadata</text><text x="1060" y="354">FinalizeJob</text></g><g fill="#545b64" font-size="11"><text x="350" y="375">Format / size checks</text><text x="535" y="375">Thumbnail variant</text><text x="720" y="375">Watermarked image</text><text x="897" y="375">Dimensions / format</text><text x="1060" y="375">Set status</text></g><g stroke="#566573" stroke-width="2" fill="none" marker-end="url(#a)"><path d="M425 361 H460"/><path d="M610 361 H645"/><path d="M795 361 H830"/><path d="M965 361 H1000"/><path d="M1202 205 V240 H350 V325"/></g><text x="695" y="435" font-size="12" fill="#566573">Tasks process S3 objects; workflow state carries keys and compact metadata, not image bytes.</text><text x="695" y="460" font-size="12" fill="#566573">Retry/Catch paths record failure and notify operators.</text><g stroke-width="2"><rect x="70" y="555" width="200" height="75" rx="8" fill="#e8f5e9" stroke="#3f8f55"/><rect x="335" y="555" width="190" height="75" rx="8" fill="#f0eaff" stroke="#8561b5"/><rect x="590" y="555" width="165" height="75" rx="8" fill="#fff4e5" stroke="#d79b00"/><rect x="825" y="555" width="180" height="75" rx="8" fill="#e8f5e9" stroke="#3f8f55"/><rect x="1075" y="555" width="230" height="75" rx="8" fill="#fdecec" stroke="#c54b4b"/></g><g fill="#232f3e" font-size="15" font-weight="bold"><text x="170" y="584">Amazon S3</text><text x="430" y="584">Amazon DynamoDB</text><text x="672" y="584">Amazon SNS</text><text x="915" y="584">CloudFront + OAC</text><text x="1190" y="584">SQS Dead-letter Queue</text></g><g fill="#545b64" font-size="12"><text x="170" y="606">Private output bucket</text><text x="430" y="606">Job status + metadata</text><text x="672" y="606">Success / failure alerts</text><text x="915" y="606">Serve cached outputs</text><text x="1190" y="606">Repeated delivery failures</text></g><g stroke="#566573" stroke-width="2" fill="none" marker-end="url(#a)"><path d="M350 397 V525 H170 V555"/><path d="M1060 397 V525 H430 V555"/><path d="M1060 397 V515 H672 V555"/><path d="M270 590 H825"/><path d="M967 205 V520 H1190 V555"/></g><text x="700" y="680" font-size="12" fill="#566573">Monitoring: CloudWatch logs, metrics, and alarms · Example architecture; configure IAM, policies, retries, and retention before deployment.</text></g></svg>